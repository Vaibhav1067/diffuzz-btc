[package]
name = "diffuzz-adapter-rust-bitcoin"
description = "diffuzz auxiliary adapter (tx serialization, sighash) around rust-bitcoin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
diffuzz-types = { path = "../../crates/types" }
serde_json = "1.0.154"
serde = "1"
# Pinned exactly: the version of the implementation under test must never drift.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
