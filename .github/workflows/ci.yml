name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test, corpus replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain + components.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/btcd-go/go.mod
          cache-dependency-path: adapters/btcd-go/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build adapters
        run: bash scripts/build_adapters.sh
      # The harness's correctness proof: every adapter must reproduce Core's expected verdicts.
      - name: Corpus replay (core, btcd, nbitcoin)
        run: >
          cargo run --locked -p diffuzz-cli -- replay
          --vectors vectors/core/script_tests.json vectors/core/tx_valid.json vectors/core/tx_invalid.json
          --impls core,btcd,nbitcoin --json out/replay.json
      # Secondary surface: legacy (sighash.json) and BIP341 key-path digests against their
      # expected values, and a decode of every vector transaction, compared across implementations.
      - name: Sighash and tx-decode differential
        run: >
          cargo run --locked -p diffuzz-cli -- aux
          --impls rust-bitcoin,btcd,nbitcoin,core --seed 1 --count 20000 --json out/aux.json
      # Smoke test of the whole fuzz loop. BIP66 (DERSIG) is forced on, as it is for every
      # block since 2015; the pre-BIP66 signature rules are fuzzed in dedicated runs.
      # The log stays on the runner (never printed or uploaded): this job's output is public,
      # and a real divergence must not be described there (CLAUDE.md rule 2).
      - name: Smoke fuzz (60 s)
        run: |
          mkdir -p out && status=0
          cargo run --locked -p diffuzz-cli -- fuzz --seed 1 --duration 60s --workers 2             --impls core,btcd --require-flags DERSIG --report-secs 20 --summary out/smoke.json             > out/smoke.log 2>&1 || status=$?
          grep '^RESULT' out/smoke.log || echo "no RESULT line (exit $status)"
          exit $status
      - name: Results dashboard
        run: >
          cargo run --locked -p diffuzz-cli -- dashboard
          --run "Smoke (CI)=out/smoke.json" --replay out/replay.json --aux "Generated 20k=out/aux.json"
          --machine "GitHub Actions ubuntu-latest, 2 workers" --out out/dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: out/dashboard.html

  go:
    name: btcd adapter (gofmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/btcd-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/btcd-go/go.mod
          cache-dependency-path: adapters/btcd-go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  vectors:
    name: vectors match pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-fetch vectors
        run: bash scripts/fetch_vectors.sh
      - name: Tracked vectors are unchanged
        run: git diff --exit-code -- vectors/

  fuzz-targets:
    name: cargo-fuzz targets (30 s each)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: Run targets
        run: |
          for t in tx_decode sighash_diff core_verify adapter_lines; do
            cargo +nightly fuzz run -O "$t" -- -max_total_time=30
          done

  libbitcoin:
    name: libbitcoin adapter (Docker build, corpus replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: docker/setup-buildx-action@v3
      - name: Build adapter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/libbitcoin.Dockerfile
          tags: diffuzz-libbitcoin
          load: true
          build-args: JOBS=4
          cache-from: type=gha,scope=libbitcoin
          cache-to: type=gha,mode=max,scope=libbitcoin
      - name: Build Core adapter
        run: cargo build --locked -p diffuzz-adapter-core -p diffuzz-cli
      - name: Corpus replay (core, libbitcoin)
        env:
          DIFFUZZ_ADAPTER_LIBBITCOIN: adapters/libbitcoin-cpp/diffuzz-adapter-libbitcoin.sh
        run: >
          cargo run --locked -p diffuzz-cli -- replay
          --vectors vectors/core/script_tests.json vectors/core/tx_valid.json vectors/core/tx_invalid.json
          --impls core,libbitcoin

  core-kernel:
    name: current Core adapter (libbitcoinkernel, Docker build, corpus replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format check (outside the workspace)
        run: cargo fmt --manifest-path adapters/core-kernel-rs/Cargo.toml -- --check
      - uses: docker/setup-buildx-action@v3
      - name: Build adapter image (runs its unit tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/core-kernel.Dockerfile
          tags: diffuzz-core-kernel
          load: true
          build-args: JOBS=4
          cache-from: type=gha,scope=core-kernel
          cache-to: type=gha,mode=max,scope=core-kernel
      - name: Build Core 26.0 adapter
        run: cargo build --locked -p diffuzz-adapter-core -p diffuzz-cli
      - name: Corpus replay (core 26.0, current core)
        env:
          DIFFUZZ_ADAPTER_CORE_KERNEL: adapters/core-kernel-rs/diffuzz-adapter-core-kernel.sh
        run: >
          cargo run --locked -p diffuzz-cli -- replay
          --vectors vectors/core/script_tests.json vectors/core/tx_valid.json vectors/core/tx_invalid.json
          --impls core,core-kernel
