name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test, corpus replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain + components.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/btcd-go/go.mod
          cache-dependency-path: adapters/btcd-go/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build adapters
        run: bash scripts/build_adapters.sh
      # The harness's correctness proof: every adapter must reproduce Core's expected verdicts.
      - name: Corpus replay (core, btcd, nbitcoin)
        run: >
          cargo run --locked -p diffuzz-cli -- replay
          --vectors vectors/core/script_tests.json vectors/core/tx_valid.json vectors/core/tx_invalid.json
          --impls core,btcd,nbitcoin
      # Secondary surface: legacy (sighash.json) and BIP341 key-path digests against their
      # expected values, and a decode of every vector transaction, compared across implementations.
      - name: Sighash and tx-decode differential
        run: >
          cargo run --locked -p diffuzz-cli -- aux
          --impls rust-bitcoin,btcd,nbitcoin,core
      # Smoke test of the whole fuzz loop. BIP66 (DERSIG) is forced on, as it is for every
      # block since 2015; the pre-BIP66 signature rules are fuzzed in dedicated runs.
      - name: Smoke fuzz (60 s)
        run: >
          cargo run --locked -p diffuzz-cli -- fuzz --seed 1 --duration 60s --workers 2
          --impls core,btcd --require-flags DERSIG --report-secs 20

  go:
    name: btcd adapter (gofmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/btcd-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/btcd-go/go.mod
          cache-dependency-path: adapters/btcd-go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  vectors:
    name: vectors match pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-fetch vectors
        run: bash scripts/fetch_vectors.sh
      - name: Tracked vectors are unchanged
        run: git diff --exit-code -- vectors/
