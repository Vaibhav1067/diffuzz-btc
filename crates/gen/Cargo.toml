[package]
name = "diffuzz-gen"
description = "Structure-aware case generators and mutators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
diffuzz-types = { path = "../types" }
secp256k1 = "0.33.1"
sha2 = "0.11.1"
ripemd = "0.2.0"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
diffuzz-adapter-core = { path = "../../adapters/core-rs" }
