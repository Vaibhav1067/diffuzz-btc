[package]
name = "diffuzz-cli"
description = "The diffuzz command-line binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "diffuzz"
path = "src/main.rs"

[dependencies]
diffuzz-types = { path = "../types" }
diffuzz-corpus = { path = "../corpus" }
diffuzz-oracle = { path = "../oracle" }
diffuzz-gen = { path = "../gen" }
diffuzz-triage = { path = "../triage" }
diffuzz-minimize = { path = "../minimize" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
