[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/corpus",
    "crates/gen",
    "crates/oracle",
    "crates/minimize",
    "crates/triage",
    "crates/cli",
    "adapters/core-rs",
    "adapters/rust-bitcoin",
]
# cargo-fuzz keeps its own workspace; non-Rust adapters have their own build systems.
exclude = ["fuzz", "adapters/btcd-go", "adapters/libbitcoin-cpp", "adapters/core-kernel-rs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/Vaibhav1067/diffuzz-btc"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
